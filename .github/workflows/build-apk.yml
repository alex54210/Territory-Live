
name: Build Territory LIVE APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Android project
        run: |
          mkdir -p apk-project/www
          cp public/index.html apk-project/www/index.html
          cd apk-project
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.alex54210.territorylive",
            "appName": "Territory LIVE",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd apk-project/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Territory-LIVE-APK
          path: apk-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

